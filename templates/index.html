<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Prompt Vault 节点式提示词与成图探索工作台" />
    <title>Prompt Vault</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='4' fill='%2318191c'/%3E%3Cpath d='M9 11h14v10H9z' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E" />
    <script>
      (() => {
        const saved = localStorage.getItem("prompt-vault-theme");
        document.documentElement.dataset.theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      })();
    </script>
    {% for stylesheet in frontend_styles %}
    <link rel="stylesheet" href="{{ url_for('static', filename='dist/' + stylesheet) }}" />
    {% endfor %}
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="{{ url_for('static', filename='dist/' + frontend_script) }}"></script>
  </body>
</html>
