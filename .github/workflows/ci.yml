name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  package-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20.20.0"
          package-manager-cache: false
      - run: npm ci
      - run: node scripts/smoke-cli-package.mjs

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20.20.0"
          package-manager-cache: false
      - run: npm ci
      - id: artifact
        name: Build and smoke canonical tarball
        run: |
          mkdir artifacts
          npm pack --workspace @miyako-lab/prompt-vault-cli --pack-destination artifacts
          mv artifacts/*.tgz artifacts/prompt-vault.tgz
          node scripts/smoke-cli-package.mjs --tarball artifacts/prompt-vault.tgz
          echo "sha256=$(sha256sum artifacts/prompt-vault.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: prompt-vault:ci
          build-args: |
            PROMPT_VAULT_VERSION=ci
            PROMPT_VAULT_TARBALL_SHA256=${{ steps.artifact.outputs.sha256 }}
            VCS_REF=${{ github.sha }}
      - name: Verify runtime contract
        run: |
          docker run -d --name prompt-vault-ci -v prompt-vault-ci-data:/data prompt-vault:ci
          for attempt in $(seq 1 60); do
            status=$(docker inspect prompt-vault-ci --format '{{.State.Health.Status}}')
            [ "$status" = healthy ] && break
            sleep 1
          done
          test "$(docker inspect prompt-vault-ci --format '{{.State.Health.Status}}')" = healthy
          test "$(docker inspect prompt-vault-ci --format '{{.Config.User}}')" = node
          first_token=$(docker exec prompt-vault-ci sha256sum /data/.vault-token | cut -d' ' -f1)
          docker rm -f prompt-vault-ci
          docker run -d --name prompt-vault-ci -v prompt-vault-ci-data:/data prompt-vault:ci
          for attempt in $(seq 1 60); do
            status=$(docker inspect prompt-vault-ci --format '{{.State.Health.Status}}')
            [ "$status" = healthy ] && break
            sleep 1
          done
          test "$(docker inspect prompt-vault-ci --format '{{.State.Health.Status}}')" = healthy
          second_token=$(docker exec prompt-vault-ci sha256sum /data/.vault-token | cut -d' ' -f1)
          test "$first_token" = "$second_token"
          docker rm -f prompt-vault-ci
          docker volume rm prompt-vault-ci-data
