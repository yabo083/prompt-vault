name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Verify installed CLI package
        run: |
          mkdir -p /tmp/prompt-vault-cli/package /tmp/prompt-vault-cli/install
          npm pack --workspace @miyako-lab/prompt-vault-cli --pack-destination /tmp/prompt-vault-cli/package
          npm install --prefix /tmp/prompt-vault-cli/install /tmp/prompt-vault-cli/package/*.tgz
          test "$(/tmp/prompt-vault-cli/install/node_modules/.bin/prompt-vault --version)" = "$(node -p "require('./packages/cli/package.json').version")"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: prompt-vault:ci
      - name: Verify runtime contract
        run: |
          docker run -d --name prompt-vault-ci -v prompt-vault-ci-data:/data prompt-vault:ci
          for attempt in $(seq 1 60); do
            status=$(docker inspect prompt-vault-ci --format '{{.State.Health.Status}}')
            [ "$status" = healthy ] && break
            sleep 1
          done
          test "$(docker inspect prompt-vault-ci --format '{{.State.Health.Status}}')" = healthy
          test "$(docker inspect prompt-vault-ci --format '{{.Config.User}}')" = node
          first_token=$(docker exec prompt-vault-ci sha256sum /data/.vault-token | cut -d' ' -f1)
          docker rm -f prompt-vault-ci
          docker run -d --name prompt-vault-ci -v prompt-vault-ci-data:/data prompt-vault:ci
          for attempt in $(seq 1 60); do
            status=$(docker inspect prompt-vault-ci --format '{{.State.Health.Status}}')
            [ "$status" = healthy ] && break
            sleep 1
          done
          test "$(docker inspect prompt-vault-ci --format '{{.State.Health.Status}}')" = healthy
          second_token=$(docker exec prompt-vault-ci sha256sum /data/.vault-token | cut -d' ' -f1)
          test "$first_token" = "$second_token"
